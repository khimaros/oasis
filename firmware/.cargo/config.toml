[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

# the classic ESP32 with 4MB of flash, for a bare `cargo build`. the
# Makefile sets MCU and ESP_IDF_SDKCONFIG_DEFAULTS for the other boards,
# and what the environment sets goes before these
[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
# keeps the ESP-IDF checkout and its tools inside firmware/.embuild
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults;sdkconfig.4mb"
